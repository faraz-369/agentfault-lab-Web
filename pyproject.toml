[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfault-lab"
version = "0.1.0"
description = "Reproducible fault-injection and recovery experiments for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AgentFault Lab contributors"}]
dependencies = [
  "pydantic>=2.5,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1"
]
keywords = ["agents", "reliability", "fault-injection", "evaluation", "testing"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "hypothesis>=6,<7", "ruff>=0.5"]
plots = ["matplotlib>=3.8"]

[project.scripts]
agentfault = "agentfault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
