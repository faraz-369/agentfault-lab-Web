services:
  - type: web
    name: agentfault-lab-api
    runtime: python
    plan: free
    branch: feat/production-platform
    buildCommand: python -m pip install --upgrade pip && python -m pip install .
    startCommand: uvicorn agentfault.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AGENTFAULT_API_KEY
        generateValue: true
      - key: AGENTFAULT_SCENARIOS_DIR
        value: /opt/render/project/src/scenarios
      - key: AGENTFAULT_RESULTS_DIR
        value: /tmp/agentfault-results
